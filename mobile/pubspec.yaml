name: labficct
description: "App móvil de gestión de laboratorios de la FICCT (UAGRM)."
publish_to: "none"
version: 0.1.0+1

environment:
  # Flutter 3.35 o superior (Dart 3.9).
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ">=16.0.0 <19.0.0"
  dio: ^5.8.0
  flutter_secure_storage: ">=9.2.0 <12.0.0"
  image_picker: ^1.1.2
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
